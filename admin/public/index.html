<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>顺路 · 运营后台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">顺</span>
      <div>
        <div class="brand-name">顺路 · 运营后台</div>
        <div class="brand-sub">校内食堂外卖 · 动线众包</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="btn-seed">生成演示订单</button>
      <button class="btn primary" id="btn-pack">运行成包</button>
      <button class="btn ghost" id="btn-reset">重置</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="overview">概览</button>
    <button class="tab" data-tab="orders">订单池</button>
    <button class="tab" data-tab="packs">顺路包</button>
    <button class="tab" data-tab="dispatch">调度台</button>
  </nav>

  <main>
    <section id="panel-overview" class="panel active">
      <div class="stats" id="stats"></div>
      <div class="card" id="pack-warning"></div>
    </section>

    <section id="panel-orders" class="panel">
      <div class="card">
        <div class="card-head">
          <h3>影子订单池</h3>
          <span class="muted" id="orders-hint"></span>
        </div>
        <div class="table-wrap">
          <table id="orders-table">
            <thead>
              <tr>
                <th>订单号</th><th>渠道</th><th>楼栋</th><th>寝室</th>
                <th>档口</th><th>波次</th><th>状态</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="panel-packs" class="panel">
      <div id="packs-list"></div>
    </section>

    <section id="panel-dispatch" class="panel">
      <div class="card">
        <div class="card-head">
          <h3>兜底巡检</h3>
          <button class="btn small" id="btn-simulate">模拟 10 分钟过去</button>
        </div>
        <div class="muted">推出去 8 分钟无人接 → 回落自有运力；接单 12 分钟未到店 → 回收</div>
        <div id="patrol-list"></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
